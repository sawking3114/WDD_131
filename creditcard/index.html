
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Info</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="card.css"/>
    <script src="card.js" defer></script>
  </head>
  <body>
    <header><h1>Checkout</h1></header>
    <main>
        <section class="errors"></section>
        <form id="checkoutForm" action="completed.html" method="get">
            <div id="grid">
                <div id="front">
                    <h5>TOTAL: $199</h5>
                    <h2>💳</h2>
                    <p id="creditCardNumberContainer" class="hide" role="region" aria-labelledby="creditCardLabel">
                        <label id="creditCardLabel" for="creditCardNumber">Credit Card Number:</label>
                        <input type="text" id="creditCardNumber" name="creditCardNumber" pattern="[0-9]{16}" placeholder="1234 5678 9101 1020" required />
                    </p>
                    <p id="cardHolderContainer" class="hide" role="region" aria-labelledby="holderLabel">
                        <label id="holderLabel" for="holderName">Card Holder's Name:</label>
                        <input type="text" id="holderName" name="holderName" placeholder="John Doe" required />
                    </p>
                    <p id="dateHolder" class="hide" role="region" aria-labelledby="expirationDate">
                        <label id="expirationDate" for="expirationDate">Expiration Date</label>
                        <input type="text" id="month" name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
                        <input type="text" id="year" name="expYear" placeholder="YY" aria-labelledby="expirationDate">
                    </p>
                </div>
                <div id="back">
                    <p id="CVCContainer" class="hide" role="region" aria-labelledby="CVCLabel">
                        <label id="CVCLabel" for="CVC">CVC/CVV</label>
                        <input type="text" id="CVC" name="CVC/CVV" placeholder="xxx" aria-labelledby="CVCLabel">
                    </p>
                </div>
            </div>
            <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
